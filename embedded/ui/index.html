<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>扣子账号浏览器</title><link rel="stylesheet" href="style.css"></head>
<body>
<aside><div class="titlebar">账号工作台</div><div class="list-heading"><div><h1>扣子账号</h1><p id="count">独立登录 · 快速切换</p></div><button id="add" class="plus" title="添加账号" aria-label="添加账号">＋</button></div>
<nav id="accounts" aria-label="账号列表"></nav><div class="sidebar-footer"><button id="all" aria-label="打开全部账号" title="打开全部账号"><span class="all-icon" aria-hidden="true">▦</span><span class="all-label">打开全部账号</span></button><label><input id="archived" type="checkbox">显示已停用账号</label><p>切换时，后台账号继续运行</p></div></aside>
<main><header><div class="topline"><button id="sidebar-toggle" aria-label="收起账号侧栏" title="收起账号侧栏" aria-expanded="true" aria-controls="accounts"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none"><rect x="2" y="3" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 3v14m6-10-3 3 3 3" stroke="currentColor" stroke-width="1.5"/></svg></button><strong id="name">扣子账号浏览器</strong><span id="status">选择账号开始</span><button id="sync">同步头像昵称</button><button id="edit">编辑</button><button id="archive">停用</button><button id="pause">暂停网页</button></div>
<div class="tabs" id="tabs"></div></header>
<div class="empty"><div class="empty-icon">◈</div><h2>一个界面，多个扣子账号</h2><p>点击左侧账号，在这里打开对应网页。</p><p>每个账号首次分别登录，之后会保留登录资料。</p><button id="resume">打开当前账号</button></div>
<footer><span id="message">后台账号保持运行；暂停网页可释放该账号的网页内存。</span><span>Chromium · 2.2.0</span></footer></main>
<dialog id="editor"><form id="form"><h2 id="editor-title">添加账号</h2><label>账号名称<input id="account-name" maxlength="80" required autocomplete="off"></label><label class="check-label"><input id="profile-name" type="checkbox">优先显示扣子昵称</label><p id="profile-hint" class="hint"></p><div id="avatar-editor"><div class="avatar-options"><span id="avatar-preview" class="avatar"></span><button id="choose-avatar" type="button">自定义头像</button><button id="restore-avatar" type="button">使用扣子头像</button></div><p class="hint">自定义只影响左侧列表，不修改扣子账号。</p></div><label>备注<textarea id="note" maxlength="300" rows="3" placeholder="用途或区分信息，请勿填写密码"></textarea></label><p id="form-error" role="alert"></p><div class="actions"><button type="button" id="cancel">取消</button><button class="primary" type="submit">保存</button></div></form></dialog>
<script src="app.js"></script></body></html>
