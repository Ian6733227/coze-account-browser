<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; frame-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>扣子账号浏览器</title><link rel="stylesheet" href="style.css"></head>
<body>
<aside><div class="titlebar">账号工作台</div><div class="list-heading"><div><h1><button id="platform-switch" type="button" aria-haspopup="menu" aria-label="切换平台"><img id="platform-icon" class="brand-icon" src="platform-icons/all.png" width="24" height="24" alt=""><span id="platform-name">全部平台</span><span class="platform-chevron" aria-hidden="true">⌄</span></button></h1><p id="count">独立登录 · 快速切换</p></div><button id="add" class="plus" title="添加账号" aria-label="添加账号">＋</button></div>
<nav id="accounts" aria-label="账号列表"></nav><div class="sidebar-footer"><button id="all" aria-label="打开全部账号网页" title="打开所有未隐藏账号的网页，切换时保留后台运行"><svg class="all-icon" aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M7 4h13v13M4 7h13v13H4zM4 11h13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="all-label" id="all-open-label">打开全部账号</span><span class="all-compact-label" aria-hidden="true">全部打开</span></button><label><input id="archived" type="checkbox">显示已隐藏账号</label><button id="help" class="help-button" aria-label="使用帮助与视频教程" title="使用帮助与视频教程"><span class="help-icon" aria-hidden="true">?</span><span class="help-label">帮助与视频教程</span></button><p>切换时，后台账号继续运行</p></div></aside>
<main><header><div class="topline"><button id="sidebar-toggle" aria-label="收起账号侧栏" title="收起账号侧栏" aria-expanded="true" aria-controls="accounts"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="none"><rect x="2" y="3" width="16" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M7 3v14m6-10-3 3 3 3" stroke="currentColor" stroke-width="1.5"/></svg></button><strong id="name">扣子账号浏览器</strong><span id="status">选择账号开始</span><button id="sync">同步头像昵称</button><button id="edit">编辑</button><button id="archive" title="仅隐藏入口，网页仍可继续运行">隐藏账号入口</button><button id="pause" title="关闭此账号的网页，保留登录资料">关闭网页</button></div>
<div class="tabs" id="tabs"></div></header>
<div class="empty"><div class="empty-icon" aria-hidden="true"><img src="../assets/zhijinhua-app.png" alt=""></div><h2 id="empty-title">一个窗口，多个账号</h2><p id="empty-description">① 选择左侧账号　② 在右侧扣子网页完成登录。</p><p id="empty-steps">③ 其他账号分别登录一次，以后点击头像切换。</p><div class="empty-actions"><button id="resume" class="primary">打开当前账号</button><button id="recover-reload" hidden>重新加载</button><button id="recover-home" hidden>返回平台首页</button><button id="empty-help">查看登录步骤</button></div></div>
<footer><span id="message">后台账号保持运行；关闭网页可释放该账号的网页内存。</span><span>Chromium · 2.4.7</span></footer></main>
<dialog id="editor"><form id="form"><h2 id="editor-title">添加账号</h2><label id="platform-field">平台<select id="account-platform"></select></label><label>账号名称<input id="account-name" maxlength="80" required autocomplete="off"></label><label class="check-label" id="profile-name-field"><input id="profile-name" type="checkbox">优先显示平台昵称</label><p id="profile-hint" class="hint"></p><div id="avatar-editor"><div class="avatar-options"><span id="avatar-preview" class="avatar"></span><button id="choose-avatar" type="button">自定义头像</button><button id="restore-avatar" type="button">使用同步头像</button></div><p class="hint">自定义只影响左侧列表，不修改平台账号。</p></div><label>备注<textarea id="note" maxlength="300" rows="3" placeholder="用途或区分信息，请勿填写密码"></textarea></label><button type="button" id="clear-account-data" class="danger-action">仅清除登录资料（保留入口）…</button><button type="button" id="delete-account" class="danger-action">删除账号并清除登录资料…</button><p class="hint">清除前会再次确认；不影响其他账号。当前未保存的编辑将取消。</p><p id="form-error" role="alert"></p><div class="actions"><button type="button" id="cancel">取消</button><button class="primary" type="submit">保存</button></div></form></dialog>
<dialog id="help-dialog" class="help-dialog" aria-labelledby="help-title"><div class="help-toolbar"><strong id="help-title">使用帮助与视频教程</strong><div class="help-actions"><button id="help-tools" type="button" aria-controls="tools-panel" aria-expanded="false">更多工具</button><button id="help-close" type="button">关闭帮助</button></div></div><iframe id="help-frame" title="扣子账号浏览器使用帮助" sandbox="allow-same-origin"></iframe>
<section id="tools-panel" class="tools-panel" aria-labelledby="tools-title" hidden>
  <h2 id="tools-title" tabindex="-1">更多工具</h2>
  <ul class="tool-list">
    <li><span><strong>Mac 远程桌面适配助手</strong><small>远程操作时，让桌面适合小屏显示。</small></span><button id="tool-remote" type="button" aria-label="在浏览器查看 Mac 远程桌面适配助手">查看 ↗</button></li>
    <li><span><strong>Mac 多屏控制</strong><small>管理 Mac 的多屏布局和常用预设。</small></span><button id="tool-display" type="button" aria-label="在浏览器查看 Mac 多屏控制">查看 ↗</button></li>
  </ul>
  <div class="tools-links"><button id="tool-catalog" type="button">软件目录 ↗</button><button id="tool-brand" type="button">关于智进化 ↗</button></div>
  <p id="tools-error" class="error" role="alert"></p>
</section></dialog>
<script src="app.js"></script></body></html>
